<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Pengeluaran Harian</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Kalkulator Pengeluaran Harian</h1>
        <p>Kelola pengeluaranmu agar lebih hemat!</p>

        <div class="card">
            <label for="anggaran">Anggaran Harian (Rp)</label>
            <input type="number" id="anggaran" placeholder="Contoh: 50000" min="0">
            <button id="simpan">Simpan Anggaran</button>
        </div>

        <div class="card">
            <h2>Tambah Pengeluaran</h2>
            <form id="formPengeluaran">
                <label for="nama">Nama Pengeluaran</label>
                <input type="text" id="nama" placeholder="Contoh: Makan siang" required>

                <label for="nominal">Nominal (Rp)</label>
                <input type="number" id="nominal" placeholder="Contoh: 15000" min="1" required>

                <button type="submit">Tambah</button>
            </form>
        </div>

        <div class="card">
            <h2>Ringkasan</h2>
            <p>Total Pengeluaran: <strong id="total">Rp0</strong></p>
            <p>Sisa Anggaran: <strong id="sisa">Rp0</strong></p>
            <p id="pesan"></p>
        </div>

        <div class="card">
            <h2>Daftar Pengeluaran</h2>
            <ul id="daftar"></ul>
            <button id="hapusSemua" class="hapus">Hapus Semua</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
